# GoPayments — Coolify / generic Docker Compose
#
# Coolify: add a Docker Compose application, set the compose file to this path.
# Do not map host ports (e.g. 80:80): Coolify's proxy already uses 80/443 on the host.
# Expose container port 80 only; assign the domain to the "web" service in Coolify.
# The API is only reachable via /api through nginx.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/stats"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
